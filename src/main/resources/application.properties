spring.application.name=Green-log

# Dynamic Port & Host Binding for Cloud Hosting (Render sets PORT env variable; defaults to 8080 locally)
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Connection (uses external DB_URL if provided; gracefully falls back to embedded H2 if no external DB configured)
spring.datasource.url=${DB_URL:jdbc:h2:mem:green_log;DB_CLOSE_DELAY=-1;MODE=MariaDB;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:maria}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
