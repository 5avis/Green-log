spring.application.name=Green-log

# Dynamic Port for Cloud Hosting (Render sets PORT env variable; defaults to 8081 locally)
server.port=${PORT:8081}

# Database Connection (uses environment variables if provided, falls back to local MariaDB)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/green_log?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:maria}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
